name: Deploy book to GitHub Pages

# Build the Modern C with Tests book with mdBook and publish it as a static
# site on GitHub Pages (https://2bits2bits2.github.io/modern-c/).
on:
  push:
    branches: [main]
    paths:
      - 'course/**'
      - '.github/workflows/mdbook.yml'
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC and to read the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build the book
        working-directory: course
        run: mdbook build

      - name: Upload the built book as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: course/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
